name: pr-title

# PRs are squash-merged with the PR title as the commit subject, so the title
# is what release-plz/git-cliff parses to build CHANGELOG.md. A malformed title
# silently drops the change from the changelog, hence this gate.
on:
  # pull_request_target so the check also runs on fork PRs. Safe here: the
  # action reads the title via the API and never checks out PR code.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # Required checks must also report inside the merge queue or it stalls; the
  # job below short-circuits to success there (the title was already validated).
  merge_group:

permissions:
  pull-requests: read

jobs:
  # Keep this job name stable because branch protection references it as required check
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Match the existing lowercase, imperative subject style
          # ("fix: report a mid-session 401 as invalid key")
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" in "{title}" must start with a lowercase
            letter.
