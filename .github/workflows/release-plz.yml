name: release-plz

# Opens the release PR that bumps the version, writes CHANGELOG.md and creates
# the tag on merge. The tag is the handoff to `Release` (using cargo-dist),
# which parses CHANGELOG.md at that commit for the GitHub Release body.
# See release-plz.toml for what release-plz does and does not own.
on:
  push:
    branches: [main]

# Everything authenticates with the GitHub App token generated per job, not
# with GITHUB_TOKEN. That is load-bearing rather than cosmetic: a tag pushed by
# the default GITHUB_TOKEN does not trigger other workflows, so `Release` would
# never fire and no binaries would be built. Same reason CI has to run on the
# release PR for it to satisfy required checks.
permissions:
  contents: read

jobs:
  # Only acts when a release-plz-* branch merges (release_always = false in
  # release-plz.toml), which is what makes this safe under squash merging.
  release:
    name: release-plz release
    if: github.repository_owner == 'onmcu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          # Full history: release-plz diffs against the last release tag.
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # No CARGO_REGISTRY_TOKEN in either job: publish = false in release-plz.toml,
  # because publish-crates.yml still owns crates.io and chains off a successful
  # `Release` run so only versions whose binaries built get published.
  release-pr:
    name: release-plz PR
    if: github.repository_owner == 'onmcu'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
